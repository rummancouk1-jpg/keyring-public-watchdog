name: Public health watchdog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the public data-free health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 20 \
            https://keyring-gamma.vercel.app/api/health > /dev/null